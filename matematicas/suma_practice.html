<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Práctica de Suma — Juegos Educativos Online</title>
  <meta name="description" content="Genera hojas de sumas aleatorias de 1 a 5 cifras, resuélvelas en pantalla y comprueba todas las respuestas de una vez." />
  <link rel="canonical" href="https://juegoseducativosonline.github.io/matematicas/suma_practice.html" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Juegos Educativos Online" />
  <meta property="og:title" content="Práctica de Suma" />
  <meta property="og:description" content="Hojas de sumas aleatorias de 1 a 5 cifras con corrección automática." />
  <meta property="og:url" content="https://juegoseducativosonline.github.io/matematicas/suma_practice.html" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .controles {
      background: var(--color-superficie-alt);
      padding: 24px;
      border-radius: var(--radio);
      margin-bottom: 24px;
      border-left: 6px solid var(--color-primario);
    }

    .controles h2 {
      color: var(--color-primario);
      margin: 0 0 20px;
      font-size: 1.2rem;
    }

    .cantidad-selector {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .cantidad-selector label {
      font-weight: bold;
      color: var(--color-texto-suave);
    }

    .cantidad-selector select {
      font-family: inherit;
      padding: 8px 14px;
      border: 2px solid var(--color-primario);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--color-superficie);
      color: var(--color-texto);
    }

    .ejercicios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
      margin-top: 24px;
      list-style: none;
      padding: 0;
    }

    .ejercicio {
      background: var(--color-superficie);
      padding: 24px;
      border-radius: var(--radio);
      border: 3px solid var(--color-borde);
      text-align: center;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .ejercicio:hover {
      transform: translateY(-3px);
      box-shadow: var(--sombra-suave);
      border-color: var(--color-primario);
    }

    .numero-ejercicio {
      position: absolute;
      top: -12px;
      left: -8px;
      background: var(--color-primario);
      color: #ffffff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .suma-problema {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 0 0 18px;
      font-family: 'Courier New', monospace;
    }

    .ejercicio .answer-input {
      width: 100%;
      max-width: 170px;
      font-size: 1.3rem;
      border-width: 3px;
    }

    .resultado {
      text-align: center;
      margin-top: 24px;
      padding: 20px;
      border-radius: var(--radio);
      font-size: 1.1rem;
      font-weight: bold;
      border: 3px solid transparent;
    }

    .resultado.exito {
      background: var(--color-exito-fondo);
      color: var(--color-exito);
      border-color: var(--color-exito-borde);
    }

    .resultado.parcial {
      background: #fff3cd;
      color: #7a5c00;
      border-color: #ffc107;
    }

    .info-nivel {
      text-align: center;
      margin: 20px 0;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 8px;
      border-left: 4px solid var(--color-primario);
    }

    .info-nivel h3 {
      color: var(--color-primario-oscuro);
      margin: 0 0 6px;
      font-size: 1.05rem;
    }

    .info-nivel p {
      margin: 0;
      color: var(--color-texto);
    }

    .acciones-centro {
      text-align: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

  <nav class="nav-sitio" aria-label="Navegación principal">
    <a href="/">🏠 Inicio</a>
    <a href="/#matematicas">🧮 Matemáticas</a>
  </nav>

  <div class="container">
    <header class="header">
      <h1>🎲 Práctica de Suma</h1>
      <p>Elige el nivel de dificultad y genera sumas aleatorias para practicar</p>
    </header>

    <main class="content" id="contenido">
      <section class="controles">
        <h2>🎯 Selecciona el Nivel de Dificultad</h2>
        <div class="level-selector" role="group" aria-label="Nivel de dificultad">
          <button type="button" class="level-btn" data-cifras="1" aria-pressed="false">🌟 1 Cifra</button>
          <button type="button" class="level-btn" data-cifras="2" aria-pressed="false">🌟🌟 2 Cifras</button>
          <button type="button" class="level-btn" data-cifras="3" aria-pressed="false">🌟🌟🌟 3 Cifras</button>
          <button type="button" class="level-btn" data-cifras="4" aria-pressed="false">🌟🌟🌟🌟 4 Cifras</button>
          <button type="button" class="level-btn" data-cifras="5" aria-pressed="false">🌟🌟🌟🌟🌟 5 Cifras</button>
        </div>

        <div class="cantidad-selector">
          <label for="cantidad">Cantidad de ejercicios:</label>
          <select id="cantidad">
            <option value="5">5 ejercicios</option>
            <option value="10" selected>10 ejercicios</option>
            <option value="15">15 ejercicios</option>
            <option value="20">20 ejercicios</option>
          </select>
        </div>

        <div class="controls">
          <button type="button" class="btn" id="generar">🎲 Generar Ejercicios</button>
          <button type="button" class="btn btn-acento" id="limpiar">🧹 Limpiar Todo</button>
        </div>

        <p class="feedback hidden" id="aviso" role="status" aria-live="polite"></p>
      </section>

      <div id="info-nivel" class="info-nivel hidden">
        <h3 id="titulo-nivel"></h3>
        <p id="descripcion-nivel"></p>
      </div>

      <ul id="ejercicios-container" class="ejercicios-grid"></ul>

      <div id="controles-verificacion" class="acciones-centro hidden">
        <button type="button" class="btn" id="verificar">🔍 Verificar Todas las Respuestas</button>
      </div>

      <p id="resultado" class="resultado hidden" role="status" aria-live="polite"></p>

      <div id="estadisticas" class="stats hidden">
        <div class="stat-item">
          <span class="stat-number" id="correctas">0</span>
          <span class="stat-label">Correctas</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="incorrectas">0</span>
          <span class="stat-label">Incorrectas</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="porcentaje">0%</span>
          <span class="stat-label">Aciertos</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/site.js"></script>
  <script>
    (function () {
      'use strict';

      var INFO_NIVELES = {
        1: { titulo: 'Nivel 1: Sumas de 1 cifra', descripcion: 'Números del 0 al 9. Ideal para principiantes.' },
        2: { titulo: 'Nivel 2: Sumas de 2 cifras', descripcion: 'Números del 10 al 99. Practica llevadas básicas.' },
        3: { titulo: 'Nivel 3: Sumas de 3 cifras', descripcion: 'Números del 100 al 999. Llevadas múltiples.' },
        4: { titulo: 'Nivel 4: Sumas de 4 cifras', descripcion: 'Números del 1.000 al 9.999. Desafío intermedio.' },
        5: { titulo: 'Nivel 5: Sumas de 5 cifras', descripcion: 'Números del 10.000 al 99.999. Nivel experto.' }
      };

      var nivel = 0;

      var elContenedor = document.getElementById('ejercicios-container');
      var elResultado = document.getElementById('resultado');
      var elEstadisticas = document.getElementById('estadisticas');
      var elAviso = document.getElementById('aviso');
      var elInfoNivel = document.getElementById('info-nivel');
      var elVerificacion = document.getElementById('controles-verificacion');
      var botonesNivel = document.querySelectorAll('.level-btn');

      /* El nivel 1 arranca en 0; los demás, en el menor número de N cifras. */
      function numeroDeNivel(cifras) {
        var min = cifras === 1 ? 0 : Math.pow(10, cifras - 1);
        return JEO.enteroAleatorio(min, Math.pow(10, cifras) - 1);
      }

      function formatear(numero) {
        return numero.toLocaleString('es');
      }

      function seleccionarNivel(nuevoNivel) {
        nivel = nuevoNivel;
        botonesNivel.forEach(function (btn) {
          btn.setAttribute('aria-pressed', String(Number(btn.dataset.cifras) === nivel));
        });

        document.getElementById('titulo-nivel').textContent = INFO_NIVELES[nivel].titulo;
        document.getElementById('descripcion-nivel').textContent = INFO_NIVELES[nivel].descripcion;
        elInfoNivel.classList.remove('hidden');
        elAviso.classList.add('hidden');
      }

      function generarEjercicios() {
        if (nivel === 0) {
          elAviso.textContent = '⚠️ Primero selecciona un nivel de dificultad.';
          elAviso.className = 'feedback incorrect';
          return;
        }

        elAviso.classList.add('hidden');

        var cantidad = parseInt(document.getElementById('cantidad').value, 10);
        /* Se monta el HTML completo y se asigna una sola vez: concatenar sobre
           innerHTML dentro del bucle vuelve a analizar todo en cada vuelta. */
        var filas = [];

        for (var i = 0; i < cantidad; i++) {
          var num1 = numeroDeNivel(nivel);
          var num2 = numeroDeNivel(nivel);
          var enunciado = formatear(num1) + ' + ' + formatear(num2);

          filas.push(
            '<li class="ejercicio">' +
              '<span class="numero-ejercicio">' + (i + 1) + '</span>' +
              '<p class="suma-problema">' + enunciado + ' =</p>' +
              '<input type="number" class="answer-input" inputmode="numeric" autocomplete="off"' +
              ' aria-label="Resultado de ' + enunciado + '"' +
              ' data-respuesta="' + (num1 + num2) + '" />' +
            '</li>'
          );
        }

        elContenedor.innerHTML = filas.join('');
        elVerificacion.classList.remove('hidden');
        elResultado.classList.add('hidden');
        elEstadisticas.classList.add('hidden');

        var primero = elContenedor.querySelector('.answer-input');
        if (primero) {
          primero.focus();
        }
      }

      function verificarTodas() {
        var campos = elContenedor.querySelectorAll('.answer-input');
        var correctas = 0;
        var incorrectas = 0;

        campos.forEach(function (campo) {
          campo.classList.remove('correcto', 'incorrecto');

          if (campo.value === '') {
            return;
          }

          if (parseInt(campo.value, 10) === Number(campo.dataset.respuesta)) {
            campo.classList.add('correcto');
            correctas++;
          } else {
            campo.classList.add('incorrecto');
            incorrectas++;
          }
        });

        mostrarResultado(correctas, incorrectas, campos.length);

        document.getElementById('correctas').textContent = correctas;
        document.getElementById('incorrectas').textContent = incorrectas;
        document.getElementById('porcentaje').textContent =
          JEO.porcentaje(correctas, correctas + incorrectas) + '%';
        elEstadisticas.classList.remove('hidden');
      }

      function mostrarResultado(correctas, incorrectas, total) {
        var respondidas = correctas + incorrectas;
        var esPerfecto = respondidas === total && incorrectas === 0;
        var mensaje;

        if (respondidas === 0) {
          mensaje = '❓ No has respondido ninguna suma aún. ¡Inténtalo! 🚀';
        } else if (esPerfecto) {
          mensaje = '🎉 ¡PERFECTO! Has resuelto correctamente todas las ' + total +
            ' sumas. ¡Eres un genio de las matemáticas! 🏆';
        } else if (correctas > respondidas / 2) {
          mensaje = '👍 ¡Muy bien! Has resuelto correctamente ' + correctas + ' de ' +
            respondidas + ' sumas respondidas. ¡Sigue así! 💪';
        } else {
          mensaje = '📚 Has resuelto correctamente ' + correctas + ' de ' + respondidas +
            ' sumas. ¡No te rindas, sigue practicando! 🌟';
        }

        elResultado.textContent = mensaje;
        elResultado.className = 'resultado ' + (esPerfecto ? 'exito' : 'parcial');
      }

      function limpiarTodo() {
        nivel = 0;
        botonesNivel.forEach(function (btn) {
          btn.setAttribute('aria-pressed', 'false');
        });
        elInfoNivel.classList.add('hidden');
        elContenedor.innerHTML = '';
        elVerificacion.classList.add('hidden');
        elResultado.classList.add('hidden');
        elEstadisticas.classList.add('hidden');
        elAviso.classList.add('hidden');
      }

      botonesNivel.forEach(function (boton) {
        boton.addEventListener('click', function () {
          seleccionarNivel(Number(boton.dataset.cifras));
        });
      });

      document.getElementById('generar').addEventListener('click', generarEjercicios);
      document.getElementById('limpiar').addEventListener('click', limpiarTodo);
      document.getElementById('verificar').addEventListener('click', verificarTodas);

      /* Enter dentro de la hoja de ejercicios equivale a pulsar "Verificar". */
      elContenedor.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          verificarTodas();
        }
      });
    })();
  </script>
</body>
</html>
