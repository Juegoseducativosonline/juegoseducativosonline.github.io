<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Práctica de Multiplicación — Juegos Educativos Online</title>
  <meta name="description" content="Practica multiplicaciones de 1 a 5 cifras con ejercicios aleatorios, corrección inmediata y estadísticas de aciertos." />
  <link rel="canonical" href="https://juegoseducativosonline.github.io/matematicas/multiplication_practice.html" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Juegos Educativos Online" />
  <meta property="og:title" content="Práctica de Multiplicación" />
  <meta property="og:description" content="Multiplicaciones de 1 a 5 cifras con corrección inmediata." />
  <meta property="og:url" content="https://juegoseducativosonline.github.io/matematicas/multiplication_practice.html" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .problem-container {
      background: var(--color-superficie-alt);
      border-radius: var(--radio);
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .problem {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      font-weight: bold;
      margin-bottom: 24px;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

  <nav class="nav-sitio" aria-label="Navegación principal">
    <a href="/">🏠 Inicio</a>
    <a href="/#matematicas">🧮 Matemáticas</a>
  </nav>

  <div class="container">
    <header class="header">
      <h1>🎯 Práctica de Multiplicación</h1>
      <p>¡Conviértete en un maestro de las multiplicaciones!</p>
    </header>

    <main class="content" id="contenido">
      <div class="level-selector" role="group" aria-label="Nivel de dificultad">
        <button type="button" class="level-btn" data-nivel="1" aria-pressed="true">Nivel 1 (1 cifra)</button>
        <button type="button" class="level-btn" data-nivel="2" aria-pressed="false">Nivel 2 (2 cifras)</button>
        <button type="button" class="level-btn" data-nivel="3" aria-pressed="false">Nivel 3 (3 cifras)</button>
        <button type="button" class="level-btn" data-nivel="4" aria-pressed="false">Nivel 4 (4 cifras)</button>
        <button type="button" class="level-btn" data-nivel="5" aria-pressed="false">Nivel 5 (5 cifras)</button>
      </div>

      <div class="problem-container">
        <p class="problem" id="problem">2 × 3 = ?</p>
        <label class="solo-lectores" for="answer">Tu respuesta</label>
        <input type="number" class="answer-input" id="answer" placeholder="Tu respuesta" inputmode="numeric" autocomplete="off" />
        <div class="acciones">
          <button type="button" class="check-btn" id="verificar">✓ Verificar</button>
          <button type="button" class="check-btn new-btn" id="nuevo">🎲 Nuevo Problema</button>
        </div>
      </div>

      <p class="feedback" id="feedback" role="status" aria-live="polite">
        ¡Selecciona un nivel y resuelve el problema! 🚀
      </p>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="correct">0</span>
          <span class="stat-label">Correctas</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="percentage">0%</span>
          <span class="stat-label">Precisión</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/site.js"></script>
  <script>
    (function () {
      'use strict';

      var nivel = 1;
      var aciertos = 0;
      var intentos = 0;
      var respuestaCorrecta = 0;

      var elProblema = document.getElementById('problem');
      var elRespuesta = document.getElementById('answer');
      var elFeedback = document.getElementById('feedback');
      var botonesNivel = document.querySelectorAll('.level-btn');

      /* El nivel N multiplica un número de N cifras por uno de una sola cifra. */
      function nuevoProblema() {
        var num1 = JEO.enteroAleatorio(Math.pow(10, nivel - 1), Math.pow(10, nivel) - 1);
        var num2 = JEO.enteroAleatorio(1, 9);

        respuestaCorrecta = num1 * num2;
        elProblema.textContent = num1 + ' × ' + num2 + ' = ?';
        elRespuesta.value = '';
        elFeedback.textContent = '¡Resuelve el problema! 🤔';
        elFeedback.className = 'feedback';
        elRespuesta.focus();
      }

      function seleccionarNivel(nuevoNivel, boton) {
        nivel = nuevoNivel;
        botonesNivel.forEach(function (btn) {
          btn.setAttribute('aria-pressed', String(btn === boton));
        });
        nuevoProblema();
      }

      function verificar() {
        var respuesta = parseInt(elRespuesta.value, 10);

        if (isNaN(respuesta)) {
          elFeedback.textContent = 'Por favor, ingresa un número válido 🔢';
          elFeedback.className = 'feedback';
          return;
        }

        intentos++;

        if (respuesta === respuestaCorrecta) {
          aciertos++;
          elFeedback.textContent = JEO.felicitacion();
          elFeedback.className = 'feedback correct';
        } else {
          elFeedback.textContent = 'Incorrecto. La respuesta correcta es ' + respuestaCorrecta + ' 🤓';
          elFeedback.className = 'feedback incorrect';
        }

        document.getElementById('correct').textContent = aciertos;
        document.getElementById('total').textContent = intentos;
        document.getElementById('percentage').textContent = JEO.porcentaje(aciertos, intentos) + '%';
      }

      botonesNivel.forEach(function (boton) {
        boton.addEventListener('click', function () {
          seleccionarNivel(Number(boton.dataset.nivel), boton);
        });
      });

      document.getElementById('verificar').addEventListener('click', verificar);
      document.getElementById('nuevo').addEventListener('click', nuevoProblema);

      elRespuesta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          verificar();
        }
      });

      nuevoProblema();
    })();
  </script>
</body>
</html>
