<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Práctica de División — Juegos Educativos Online</title>
  <meta name="description" content="Practica divisiones exactas de 1 a 5 cifras con rachas, subida automática de nivel y estadísticas de precisión." />
  <link rel="canonical" href="https://juegoseducativosonline.github.io/matematicas/division_practice.html" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Juegos Educativos Online" />
  <meta property="og:title" content="Práctica de División" />
  <meta property="og:description" content="Divisiones exactas de 1 a 5 cifras con rachas y niveles." />
  <meta property="og:url" content="https://juegoseducativosonline.github.io/matematicas/division_practice.html" />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .problem-area {
      text-align: center;
      margin: 24px 0;
      padding: 32px 20px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-radius: var(--radio);
      color: #ffffff;
    }

    .division-problem {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: bold;
      margin: 0 0 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
    }

    @keyframes confetti-fall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

  <nav class="nav-sitio" aria-label="Navegación principal">
    <a href="/">🏠 Inicio</a>
    <a href="/#matematicas">🧮 Matemáticas</a>
    <a href="/#espanol">📖 Español</a>
    <a href="/#sociales">🌎 Sociales</a>
    <a href="/#naturales">🌿 Naturales</a>
  </nav>

  <div class="container">
    <header class="header">
      <h1>🧮 Práctica de División</h1>
      <p>Divisiones exactas: sube de nivel encadenando aciertos.</p>
    </header>

    <main class="content" id="contenido">
      <div class="level-selector" role="group" aria-label="Nivel de dificultad">
        <button type="button" class="level-btn" data-nivel="1" aria-pressed="true">1 Cifra</button>
        <button type="button" class="level-btn" data-nivel="2" aria-pressed="false">2 Cifras</button>
        <button type="button" class="level-btn" data-nivel="3" aria-pressed="false">3 Cifras</button>
        <button type="button" class="level-btn" data-nivel="4" aria-pressed="false">4 Cifras</button>
        <button type="button" class="level-btn" data-nivel="5" aria-pressed="false">5 Cifras</button>
      </div>

      <div class="progress-bar" role="progressbar" id="progressBar" aria-label="Precisión acumulada"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="problem-area">
        <p class="division-problem" id="problem">8 ÷ 2 = ?</p>
        <label class="solo-lectores" for="answerInput">Tu respuesta</label>
        <input type="number" class="answer-input" id="answerInput" placeholder="?" inputmode="numeric" autocomplete="off" />
        <div class="acciones">
          <button type="button" class="check-btn" id="verificar">✓ Verificar</button>
          <button type="button" class="check-btn next-btn" id="siguiente">➜ Siguiente</button>
        </div>
      </div>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="correctCount">0</span>
          <span class="stat-label">Correctas</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="percentage">0%</span>
          <span class="stat-label">Precisión</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="streak">0</span>
          <span class="stat-label">Racha</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="toNextLevel">20</span>
          <span class="stat-label">Para siguiente nivel</span>
        </div>
      </div>
    </main>
  </div>

  <div class="celebration" id="celebration" aria-hidden="true"></div>

  <script src="/assets/site.js"></script>
  <script>
    (function () {
      'use strict';

      var NIVEL_MAXIMO = 5;
      var ACIERTOS_PARA_SUBIR = 20;
      var ESPERA_SIGUIENTE_MS = 1500;
      var ESPERA_SUBIR_NIVEL_MS = 2500;
      var TROZOS_CONFETI = 50;
      var RETARDO_CONFETI_MAX_S = 2;
      /* Debe coincidir con la duración de @keyframes confetti-fall. */
      var DURACION_CONFETI_S = 3;

      /* Divisor máximo de cada nivel, por índice de nivel - 1. El dividendo
         del nivel N tiene siempre exactamente N cifras. */
      var DIVISOR_MAXIMO = [9, 9, 99, 99, 999];

      var nivel = 1;
      var dividendo = 0;
      var divisor = 0;
      var respuestaCorrecta = 0;
      var aciertos = 0;
      var intentos = 0;
      var racha = 0;

      /* Un único temporizador pendiente: evita que dos avances automáticos
         se pisen si la persona responde o pulsa "Siguiente" mientras espera. */
      var temporizador = null;
      var limpiezaConfeti = null;

      var elProblema = document.getElementById('problem');
      var elRespuesta = document.getElementById('answerInput');
      var elFeedback = document.getElementById('feedback');
      var elCelebracion = document.getElementById('celebration');
      var botonesNivel = document.querySelectorAll('.level-btn');

      function programar(accion, retardoMs) {
        cancelarPendiente();
        temporizador = setTimeout(function () {
          temporizador = null;
          accion();
        }, retardoMs);
      }

      function cancelarPendiente() {
        if (temporizador !== null) {
          clearTimeout(temporizador);
          temporizador = null;
        }
      }

      function nuevoProblema() {
        cancelarPendiente();

        var dividendoMinimo = Math.pow(10, nivel - 1);
        var dividendoMaximo = Math.pow(10, nivel) - 1;

        /* Se construye la división a partir del resultado para que siempre
           sea exacta: dividendo = divisor × cociente. El cociente se acota
           para que el dividendo caiga en el rango de cifras del nivel. Ese
           rango tiene 9 × dividendoMinimo valores, que en todos los niveles es
           al menos el divisor máximo: siempre contiene algún múltiplo. */
        divisor = JEO.enteroAleatorio(1, DIVISOR_MAXIMO[nivel - 1]);
        var cociente = JEO.enteroAleatorio(
          Math.ceil(dividendoMinimo / divisor),
          Math.floor(dividendoMaximo / divisor)
        );
        dividendo = divisor * cociente;
        respuestaCorrecta = cociente;

        elProblema.textContent = dividendo + ' ÷ ' + divisor + ' = ?';
        elRespuesta.value = '';
        elFeedback.textContent = '';
        elFeedback.className = 'feedback';
        elRespuesta.focus();
      }

      function marcarNivelActivo() {
        botonesNivel.forEach(function (btn) {
          btn.setAttribute('aria-pressed', String(Number(btn.dataset.nivel) === nivel));
        });
      }

      function seleccionarNivel(nuevoNivel) {
        nivel = nuevoNivel;
        racha = 0;
        marcarNivelActivo();
        actualizarEstadisticas();
        nuevoProblema();
      }

      function subirNivel() {
        nivel++;
        racha = 0;
        marcarNivelActivo();
        actualizarEstadisticas();

        elFeedback.textContent = '🎉 ¡Nivel completado! Pasando a ' + nivel + ' cifras... 🎉';
        elFeedback.className = 'feedback correct';
        lanzarConfeti();

        programar(nuevoProblema, ESPERA_SUBIR_NIVEL_MS);
      }

      function verificar() {
        var respuesta = parseInt(elRespuesta.value, 10);

        if (isNaN(respuesta)) {
          elFeedback.textContent = '¡Por favor ingresa un número!';
          elFeedback.className = 'feedback incorrect';
          return;
        }

        intentos++;

        if (respuesta === respuestaCorrecta) {
          aciertos++;
          racha++;
          elFeedback.textContent = '¡Excelente! ' + dividendo + ' ÷ ' + divisor + ' = ' + respuestaCorrecta + ' ✨';
          elFeedback.className = 'feedback correct';

          if (racha % 5 === 0) {
            lanzarConfeti();
          }

          var subeDeNivel = racha >= ACIERTOS_PARA_SUBIR && nivel < NIVEL_MAXIMO;
          programar(subeDeNivel ? subirNivel : nuevoProblema, ESPERA_SIGUIENTE_MS);
        } else {
          racha = 0;
          elFeedback.textContent = 'Incorrecto. ' + dividendo + ' ÷ ' + divisor + ' = ' + respuestaCorrecta + '. ¡Sigue intentando! 💪';
          elFeedback.className = 'feedback incorrect';
        }

        actualizarEstadisticas();
      }

      function actualizarEstadisticas() {
        var precision = JEO.porcentaje(aciertos, intentos);

        document.getElementById('correctCount').textContent = aciertos;
        document.getElementById('totalCount').textContent = intentos;
        document.getElementById('percentage').textContent = precision + '%';
        document.getElementById('streak').textContent = racha;
        document.getElementById('toNextLevel').textContent =
          nivel < NIVEL_MAXIMO ? ACIERTOS_PARA_SUBIR - racha : '¡Máximo!';

        document.getElementById('progressFill').style.width = precision + '%';
        document.getElementById('progressBar').setAttribute('aria-valuenow', precision);
      }

      function lanzarConfeti() {
        var colores = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3'];

        /* Cada lanzamiento sustituye al anterior: así el número de trozos vivos
           está acotado aunque se encadenen varias celebraciones seguidas. */
        clearTimeout(limpiezaConfeti);
        elCelebracion.replaceChildren();

        for (var i = 0; i < TROZOS_CONFETI; i++) {
          var trozo = document.createElement('div');
          trozo.className = 'confetti';
          trozo.style.left = Math.random() * 100 + 'vw';
          trozo.style.backgroundColor = JEO.alAzar(colores);
          trozo.style.animationDelay = (Math.random() * RETARDO_CONFETI_MAX_S).toFixed(2) + 's';
          /* Lo normal es que cada trozo se retire al acabar su propia animación,
             para que los que tienen retardo no desaparezcan antes de caer. */
          trozo.addEventListener('animationend', function () {
            this.remove();
          });
          elCelebracion.appendChild(trozo);
        }

        /* Respaldo: con la pestaña en segundo plano el navegador congela las
           animaciones y 'animationend' no llega nunca. Sin esto, el confeti se
           acumularía en el DOM indefinidamente. */
        limpiezaConfeti = setTimeout(function () {
          elCelebracion.replaceChildren();
        }, (RETARDO_CONFETI_MAX_S + DURACION_CONFETI_S) * 1000 + 500);
      }

      botonesNivel.forEach(function (boton) {
        boton.addEventListener('click', function () {
          seleccionarNivel(Number(boton.dataset.nivel));
        });
      });

      document.getElementById('verificar').addEventListener('click', verificar);
      document.getElementById('siguiente').addEventListener('click', nuevoProblema);

      elRespuesta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          verificar();
        }
      });

      actualizarEstadisticas();
      nuevoProblema();
    })();
  </script>
</body>
</html>
