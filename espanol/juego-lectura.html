<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comprensión de Lectura — Juegos Educativos Online</title>
  <meta name="description" content="Lee textos cortos, un cuento y un texto informativo, y responde preguntas de comprensión lectora con corrección inmediata." />
  <link rel="canonical" href="https://juegoseducativosonline.github.io/espanol/juego-lectura.html" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Juegos Educativos Online" />
  <meta property="og:title" content="Comprensión de Lectura" />
  <meta property="og:description" content="Textos cortos con preguntas de comprensión lectora." />
  <meta property="og:url" content="https://juegoseducativosonline.github.io/espanol/juego-lectura.html" />
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="stylesheet" href="/assets/quiz.css" />
</head>
<body>
  <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

  <nav class="nav-sitio" aria-label="Navegación principal">
    <a href="/">🏠 Inicio</a>
    <a href="/#matematicas">🧮 Matemáticas</a>
    <a href="/#espanol">📖 Español</a>
    <a href="/#sociales">🌎 Sociales</a>
    <a href="/#naturales">🌿 Naturales</a>
  </nav>

  <div class="container">
    <header class="header">
      <h1>📖 Comprensión de Lectura</h1>
      <p>Lee con atención cada texto y responde las preguntas.</p>
    </header>

    <main class="content" id="contenido">
      <div id="quiz">
        <noscript><p>Este juego necesita JavaScript activado en el navegador.</p></noscript>
      </div>
    </main>
  </div>

  <script src="/assets/site.js"></script>
  <script src="/assets/quiz.js"></script>
  <script>
    (function () {
      'use strict';

      var HUERTO = {
        titulo: 'El huerto del abuelo',
        parrafos: [
          'Cada sábado, Lucía visita a su abuelo Tomás, que vive en una casa con un pequeño huerto. Allí cultivan tomates, lechugas y zanahorias.',
          'Una mañana, Lucía notó que las hojas de los tomates estaban caídas y amarillentas. —Abuelo, ¿qué les pasa a las plantas? —preguntó preocupada.',
          'El abuelo tocó la tierra con los dedos y sonrió. —Está muy seca. Esta semana no ha llovido y nadie las ha regado. Lucía llenó la regadera y regó las plantas con cuidado.',
          'El sábado siguiente, las plantas estaban verdes y firmes otra vez. Lucía decidió que, desde ese día, llamaría a su abuelo cada miércoles para recordarle regar el huerto.'
        ]
      };

      var COLIBRI = {
        titulo: 'El colibrí',
        parrafos: [
          'El colibrí es uno de los pájaros más pequeños del mundo. Algunas especies miden apenas unos centímetros y pesan solo unos pocos gramos.',
          'Sus alas se mueven tan rápido que casi no podemos verlas. Gracias a eso, el colibrí puede quedarse quieto en el aire, como si flotara, e incluso volar hacia atrás.',
          'Se alimenta sobre todo del néctar de las flores, que es un líquido dulce. Para alcanzarlo usa su pico largo y delgado. Al pasar de flor en flor, lleva polen de una a otra y así ayuda a que las plantas produzcan semillas.',
          'Los colibríes solo viven en América: desde Alaska, en el norte, hasta el extremo sur de Argentina y Chile.'
        ]
      };

      JEO.iniciarQuiz({
        contenedor: document.getElementById('quiz'),
        /* Las preguntas de un mismo texto van juntas y en orden. */
        mezclarPreguntas: false,
        preguntas: [
          {
            pasaje: HUERTO,
            enunciado: '¿A quién visita Lucía cada sábado?',
            opciones: ['A su abuelo Tomás', 'A su tía', 'A su maestra', 'A su vecino'],
            correcta: 0
          },
          {
            pasaje: HUERTO,
            enunciado: '¿Por qué estaban caídas las hojas de los tomates?',
            opciones: [
              'Porque la tierra estaba muy seca',
              'Porque hacía mucho frío',
              'Porque se las comieron los insectos',
              'Porque tenían demasiada agua'
            ],
            correcta: 0,
            explicacion: 'El abuelo tocó la tierra y dijo que estaba muy seca porque no había llovido.'
          },
          {
            pasaje: HUERTO,
            enunciado: '¿Cómo se sintió Lucía al ver las plantas caídas?',
            opciones: ['Preocupada', 'Aburrida', 'Enojada', 'Contenta'],
            correcta: 0,
            explicacion: 'El texto dice que «preguntó preocupada».'
          },
          {
            pasaje: HUERTO,
            enunciado: '¿Qué decidió hacer Lucía al final?',
            opciones: [
              'Llamar a su abuelo cada miércoles para recordarle regar',
              'Plantar más tomates',
              'Comprar una regadera nueva',
              'Visitar a su abuelo todos los días'
            ],
            correcta: 0
          },
          {
            pasaje: HUERTO,
            enunciado: '¿Qué enseñanza nos deja este cuento?',
            opciones: [
              'Que las plantas necesitan agua y cuidados para vivir',
              'Que los tomates crecen solos sin ayuda',
              'Que no hay que tocar la tierra',
              'Que el huerto solo se riega los sábados'
            ],
            correcta: 0,
            explicacion: 'Cuando Lucía las regó, las plantas se recuperaron.'
          },
          {
            pasaje: COLIBRI,
            enunciado: '¿Qué tipo de texto es «El colibrí»?',
            opciones: [
              'Un texto informativo, que explica datos reales',
              'Un cuento con personajes inventados',
              'Un poema con rima',
              'Una receta de cocina'
            ],
            correcta: 0,
            explicacion: 'No cuenta una historia: da información sobre un animal real.'
          },
          {
            pasaje: COLIBRI,
            enunciado: 'Según el texto, ¿qué puede hacer el colibrí gracias a la rapidez de sus alas?',
            opciones: [
              'Quedarse quieto en el aire y volar hacia atrás',
              'Nadar bajo el agua',
              'Correr muy rápido por el suelo',
              'Dormir mientras vuela'
            ],
            correcta: 0
          },
          {
            pasaje: COLIBRI,
            enunciado: '¿Qué es el néctar?',
            opciones: [
              'Un líquido dulce de las flores',
              'Un tipo de semilla',
              'Una parte del pico',
              'Un insecto pequeño'
            ],
            correcta: 0,
            explicacion: 'El texto lo explica justo después de nombrarlo: «que es un líquido dulce».'
          },
          {
            pasaje: COLIBRI,
            enunciado: '¿Cómo ayuda el colibrí a las plantas?',
            opciones: [
              'Lleva polen de una flor a otra',
              'Les da sombra con sus alas',
              'Se come las hojas secas',
              'Riega la tierra'
            ],
            correcta: 0
          },
          {
            pasaje: COLIBRI,
            enunciado: '¿Dónde viven los colibríes?',
            opciones: ['Solo en América', 'En todos los continentes', 'Solo en África', 'Solo en Europa'],
            correcta: 0
          }
        ]
      });
    })();
  </script>
</body>
</html>
